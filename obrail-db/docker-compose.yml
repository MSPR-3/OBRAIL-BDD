services:
  db:
    image: postgis/postgis:15-3.4
    container_name: obrail_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: obrail
      POSTGRES_USER: obrail_user
      POSTGRES_PASSWORD: obrail_pass
    volumes:
      - obrail_pgdata:/var/lib/postgresql/data
      - ./db/init_obrail_db.sql:/docker-entrypoint-initdb.d/init_obrail_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obrail_user -d obrail"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  obrail_pgdata:
    driver: local
