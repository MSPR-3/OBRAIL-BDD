services:
  db:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: obrail_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - obrail_pgdata:/var/lib/postgresql/data
      - ./db/init_obrail_db.sql:/docker-entrypoint-initdb.d/init_obrail_db.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: obrail_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  obrail_pgdata:
    driver: local
